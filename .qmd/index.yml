collections:
  yingdao-api:
    path: ./xbot-api-docs/docs
    pattern: "**/*.md"
    includeByDefault: true
    context:
      /: 影刀 xbot API、市场指令、参数、返回值与已核验行为。涉及 API 事实时属于高优先级正式事实来源。
  yingdao-skills:
    path: ./project-template/.agents/skills
    pattern: "**/*.md"
    includeByDefault: true
    context:
      /: 影刀项目三个正式 Skill 及其完整参考资料。包括代码质量、影刀工具、跨 API 开发经验、项目骨架、多数据源安全、异步导出、钉钉通知、通用排错和教学 Demo。只按任务读取，不替代正式 API 事实或项目 AGENTS 规则。
  yingdao-reference:
    path: ./reference-projects
    pattern: "**/*.md"
    includeByDefault: true
    context:
      /: 真实影刀项目的冻结实现参考，只用于参考实际落地方式。属于参考层，不能覆盖正式 API 事实、AGENTS 规则或 Skill 正式知识。
models:
  embed: hf:ggml-org/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf
